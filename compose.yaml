services:
  api:
    image: career-arena-api:${RELEASE_TAG:?Set RELEASE_TAG}
    build: ./backend
    env_file:
      - ${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE}
    environment:
      FLASK_ENV: production
      FRONTEND_ORIGIN: https://${SITE_HOST:?Set SITE_HOST}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  edge:
    image: career-arena-edge:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
