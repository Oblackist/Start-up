[pytest]
testpaths = tests
addopts = -q
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
    # The ORM model class TestAttempt matches `Test*` collection; it is not a test.
    ignore::pytest.PytestCollectionWarning
